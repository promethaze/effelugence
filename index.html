<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Yellow & Black Cursive 3D Orbit</title>

  <!-- Google Fonts Cursive Fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@600&family=Cedarville+Cursive&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Local Sabrina Font Definition */
    @font-face {
      font-family: 'Sabrina';
      src: url('SABRINA_.TTF') format('truetype'),
           url('SABRINAS.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    body {
      background-color: #000000;
      color: #ffd700;
      font-family: 'Sabrina', 'Dancing Script', 'Cedarville Cursive', 'Caveat', cursive, sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }

    /* SVG Filter for Subtle Scribble Distortion */
    .scribble-text {
      filter: url(#scribble-filter);
    }

    /* Glowing Text Styling */
    .halo-word {
      position: absolute;
      top: 0;
      left: 0;
      transform-style: preserve-3d;
      white-space: nowrap;
      color: #ffd700;
      text-shadow: 
        0 0 8px rgba(255, 215, 0, 0.9),
        0 0 18px rgba(255, 180, 0, 0.6),
        0 0 32px rgba(218, 165, 32, 0.4);
      cursor: default;
      transition: color 0.2s, text-shadow 0.2s, scale 0.2s;
      font-family: 'Sabrina', 'Dancing Script', 'Cedarville Cursive', 'Caveat', cursive, sans-serif;
      will-change: transform, opacity;
    }

    /* Interactivity for Riveting & Blood */
    .halo-word.interactive {
      cursor: pointer;
    }

    .halo-word.interactive:hover {
      color: #ffffff;
      text-shadow: 
        0 0 12px #ffffff,
        0 0 25px #ffd700,
        0 0 45px #ffa500;
      scale: 1.15;
    }

    /* Glitch Entrance Keyframes */
    @keyframes glitchFadeIn {
      0% {
        opacity: 0;
        filter: blur(12px) contrast(200%);
        transform: scale(0.85);
      }
      20% {
        opacity: 0.4;
        filter: drop-shadow(-4px 2px 0px #ffd700) drop-shadow(4px -2px 0px #000);
      }
      40% {
        opacity: 0.2;
        filter: blur(4px);
      }
      60% {
        opacity: 0.85;
        filter: drop-shadow(3px -1px 0px #e6c200);
      }
      80% {
        opacity: 0.7;
        filter: blur(1px);
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: scale(1);
      }
    }

    .glitch-entrance {
      animation: glitchFadeIn 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* Visual Glitch Flash Overlay on Audio Trigger */
    #glitch-overlay {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.25) 0%, rgba(0,0,0,0) 70%);
      opacity: 0;
      transition: opacity 0.08s ease-out;
      z-index: 50;
    }

    #glitch-overlay.active {
      opacity: 1;
    }
  </style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen overflow-hidden">

  <!-- SVG Filter Definition for Scribble Effect -->
  <svg class="hidden" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="scribble-filter" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <!-- Screen Glitch Pulse Overlay -->
  <div id="glitch-overlay"></div>

  <!-- Audio Elements -->
  <audio id="riveting-audio" src="rivetingv2.mp3" preload="auto"></audio>
  <audio id="blood-audio" src="brenda!..mp3" preload="auto"></audio>

  <!-- Main Viewport Container Locked to Viewport Center -->
  <div id="main-viewport" class="fixed inset-0 flex items-center justify-center pointer-events-auto glitch-entrance">
    
    <!-- 3D Orbit Centered Stage -->
    <div id="halo-stage" class="absolute w-0 h-0 flex items-center justify-center preserve-3d" style="top: 50%; left: 50%; transform: translate(-50%, -50%);">
      <div id="words-container" class="relative w-0 h-0 flex items-center justify-center preserve-3d"></div>
    </div>

  </div>

  <script>
    // List of words to render in the 3D circle
    const wordsList = [
      "effulgence",
      "dissolution",
      "distortion",
      "blood",
      "spazzout",
      "earfuck",
      "static",
      "strobe",
      "turnt",
      "riveting",
      "paint"
    ];

    // Orbit parameters - Wider radius to space words apart
    const ORBIT_RADIUS = 360;     // Expanded orbit radius in pixels
    const SPEED_MULTIPLIER = 0.9; // Fixed 0.9x speed
    const BASE_ROTATION_SPEED = 0.005 * SPEED_MULTIPLIER;
    const TILT_X = 22;            // Slightly tilted perspective

    const wordsContainer = document.getElementById('words-container');
    const glitchOverlay = document.getElementById('glitch-overlay');
    const rivetingAudio = document.getElementById('riveting-audio');
    const bloodAudio = document.getElementById('blood-audio');

    let currentAngle = 0;
    const wordElements = [];

    // Synthesizer Audio Fallback
    let audioCtx = null;
    function playFallbackSynth(pitch = 110) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.6);

        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.6);
      } catch (e) {
        console.log("Web Audio Fallback error:", e);
      }
    }

    // Trigger Visual Flash Effect
    function triggerFlash() {
      glitchOverlay.classList.add('active');
      setTimeout(() => glitchOverlay.classList.remove('active'), 180);
    }

    // Play Audio when clicking "riveting"
    function triggerRivetingAudio() {
      triggerFlash();
      if (rivetingAudio) {
        rivetingAudio.currentTime = 0;
        const playPromise = rivetingAudio.play();

        if (playPromise !== undefined) {
          playPromise.catch(err => {
            console.warn("Local MP3 play prevented or file missing, playing synth fallback:", err);
            playFallbackSynth(110);
          });
        }
      } else {
        playFallbackSynth(110);
      }
    }

    // Play Audio when clicking "blood"
    function triggerBloodAudio() {
      triggerFlash();
      if (bloodAudio) {
        bloodAudio.currentTime = 0;
        const playPromise = bloodAudio.play();

        if (playPromise !== undefined) {
          playPromise.catch(err => {
            console.warn("Primary path for brenda!..mp3 failed, trying encoded path...", err);
            
            // Try playing via encoded URL if standard path fails
            bloodAudio.src = "brenda%21..mp3";
            bloodAudio.currentTime = 0;
            
            bloodAudio.play().catch(e => {
              console.warn("Encoded path failed, trying secondary path...", e);
              bloodAudio.src = "brenda%21%20..mp3";
              bloodAudio.play().catch(e2 => {
                console.warn("Local audio failed, playing fallback synth:", e2);
                playFallbackSynth(85);
              });
            });
          });
        }
      } else {
        playFallbackSynth(85);
      }
    }

    // Generate Word Elements around circle
    function createWords() {
      wordsContainer.innerHTML = '';
      wordElements.length = 0;

      const count = wordsList.length;

      wordsList.forEach((wordText, i) => {
        const el = document.createElement('div');
        el.className = 'halo-word scribble-text';
        el.textContent = wordText;

        // Controlled font size scale
        el.style.fontSize = '1.8rem';

        const lowerWord = wordText.toLowerCase();

        if (lowerWord === 'riveting') {
          el.classList.add('interactive');
          el.title = "Click to play rivetingv2.mp3";
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            triggerRivetingAudio();
          });
        } else if (lowerWord === 'blood') {
          el.classList.add('interactive');
          el.title = "Click to play brenda!..mp3";
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            triggerBloodAudio();
          });
        }

        wordsContainer.appendChild(el);

        const angleOffset = (i / count) * Math.PI * 2;
        wordElements.push({
          element: el,
          angleOffset: angleOffset
        });
      });
    }

    // 3D Orbit Loop
    function animate() {
      currentAngle += BASE_ROTATION_SPEED;

      const radX = (TILT_X * Math.PI) / 180;
      const cosX = Math.cos(radX);
      const sinX = Math.sin(radX);

      wordElements.forEach(item => {
        const angle = currentAngle + item.angleOffset;

        // Circular coordinates
        const x = Math.cos(angle) * ORBIT_RADIUS;
        const z = Math.sin(angle) * ORBIT_RADIUS;
        const y = 0;

        // Apply 3D X-Tilt Matrix
        const rotY = y * cosX - z * sinX;
        const rotZ = y * sinX + z * cosX;

        // Depth perspective calculation - Controlled scaling prevents overlap
        const perspective = 700;
        const rawScale = perspective / (perspective - rotZ);
        const scale = Math.min(Math.max(rawScale, 0.65), 1.1); // Scaled between 0.65 and 1.1
        const opacity = Math.max(0.2, Math.min(1, (rotZ + ORBIT_RADIUS) / (ORBIT_RADIUS * 2) + 0.25));

        // Center element transform (-50%, -50%)
        item.element.style.transform = `translate3d(${x}px, ${rotY}px, ${rotZ}px) translate(-50%, -50%) scale(${scale.toFixed(3)})`;
        item.element.style.opacity = opacity.toFixed(3);
        item.element.style.zIndex = Math.round(rotZ + 500);
      });

      requestAnimationFrame(animate);
    }

    // Initialize
    createWords();
    animate();
  </script>
</body>
</html>
