<!DOCTYPE html>
<html lang="en" class="h-full bg-black text-amber-400">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Yellow & Black Cursive Text Halo</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Cursive & Handwritten Fonts Fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@700&family=Cedarville+Cursive&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* Local Sabrina Font Face Definition */
    @font-face {
      font-family: 'Sabrina';
      src: url('SABRINA_.TTF') format('truetype'),
           url('SABRINAS.TTF') format('truetype'),
           local('Sabrina'),
           local('Sabrina Regular');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    body {
      font-family: 'Sabrina', 'Dancing Script', 'Cedarville Cursive', 'Caveat', 'Alex Brush', cursive, sans-serif;
      overflow: hidden;
      user-select: none;
      background-color: #000000;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
    }

    /* SVG Scribble Filter application */
    .scribble-text {
      filter: url(#scribble-filter);
    }

    /* 3D Viewport Setup */
    .viewport-3d {
      perspective: 1100px;
      perspective-origin: 50% 50%;
    }

    /* Stage forced to absolute center */
    .halo-stage {
      transform-style: preserve-3d;
      will-change: transform;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .halo-ring {
      transform-style: preserve-3d;
      will-change: transform;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Glow and typography styling for glowing yellow words */
    .word-item {
      transform-style: preserve-3d;
      backface-visibility: visible;
      color: #ffee00;
      text-shadow: 
        0 0 6px #fff7a1,
        0 0 14px #ffd700,
        0 0 28px #ffae00,
        0 0 50px #cc8800;
      transition: text-shadow 0.2s, color 0.2s, transform 0.1s;
    }

    .word-item:hover {
      color: #ffffff;
      text-shadow: 
        0 0 10px #ffffff,
        0 0 22px #ffea00,
        0 0 45px #ffaa00;
    }

    .riveting-word {
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: rgba(255, 238, 0, 0.6);
    }

    .halo-light-ring {
      border: 2px dashed #ffea00;
      box-shadow: 0 0 45px #ffcc00, inset 0 0 45px #ffcc00;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotateX(72deg);
      pointer-events: none;
      opacity: 0.75;
      filter: blur(1px);
    }

    /* Glitch & Intro overlay styles */
    #glitch-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      pointer-events: none;
      opacity: 1;
      transition: opacity 1.8s ease-out;
    }

    .glitch-active {
      animation: flashGlitch 0.15s infinite alternate;
    }

    @keyframes flashGlitch {
      0% {
        transform: translate(0, 0) skew(0deg);
        filter: hue-rotate(0deg) contrast(100%);
      }
      20% {
        transform: translate(-6px, 4px) skew(5deg);
        filter: invert(40%);
      }
      40% {
        transform: translate(7px, -4px) skew(-4deg);
      }
      60% {
        transform: translate(-5px, -6px) skew(3deg);
      }
      80% {
        transform: translate(6px, 4px) skew(-5deg);
      }
      100% {
        transform: translate(0, 0) skew(0deg);
      }
    }

    /* Chromatic Aberration intro effect */
    .intro-chromatic {
      animation: chromaticIntro 1.8s ease-in-out forwards;
    }

    @keyframes chromaticIntro {
      0% {
        opacity: 0;
        filter: blur(12px) contrast(300%);
        transform: scale(0.7);
      }
      30% {
        opacity: 0.6;
        filter: blur(6px) drop-shadow(-8px 0px 0px #ffe600) drop-shadow(8px 0px 0px #ffaa00);
      }
      70% {
        opacity: 0.9;
        filter: blur(2px) drop-shadow(-3px 0px 0px #ffff00);
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: scale(1);
      }
    }
  </style>
</head>
<body class="h-full w-full flex items-center justify-center overflow-hidden bg-black">

  <!-- Inline SVG Filter for Scribble Cursive Distortion -->
  <svg class="hidden" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="scribble-filter" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <!-- Local Audio Element for rivetingv2.mp3 -->
  <audio id="riveting-audio" src="rivetingv2.mp3" preload="auto"></audio>

  <!-- Glitch & Fade-In Intro Overlay -->
  <div id="glitch-overlay"></div>

  <!-- Ambient Particle Canvas -->
  <canvas id="bg-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

  <!-- Main Centered 3D Viewport Stage -->
  <main id="main-viewport" class="fixed inset-0 w-full h-full viewport-3d flex items-center justify-center intro-chromatic overflow-hidden">
    <div id="halo-stage" class="halo-stage w-0 h-0 flex items-center justify-center">
      <div id="halo-light" class="halo-light-ring"></div>
      <div id="halo-ring" class="halo-ring">
        <!-- Words rendered via JavaScript -->
      </div>
    </div>
  </main>

  <script>
    // Exact requested words array
    const WORDS = [
      'effulgence',
      'dissolution',
      'distortion',
      'blood',
      'spazzout',
      'earfuck',
      'static',
      'strobe',
      'turnt',
      'riveting',
      'paint'
    ];

    // Core Animation Configuration
    const CONFIG = {
      radius: 280,          // Ring radius in px
      tilt: 72,             // Fixed X-axis angle tilt
      speedMultiplier: 0.9,  // Fixed 0.9x rotation speed
      baseSpeed: 0.005      // Angular increment per frame
    };

    // DOM Elements
    const haloRing = document.getElementById('halo-ring');
    const haloLight = document.getElementById('halo-light');
    const haloStage = document.getElementById('halo-stage');
    const viewport = document.getElementById('main-viewport');
    const glitchOverlay = document.getElementById('glitch-overlay');
    const rivetingAudio = document.getElementById('riveting-audio');
    const bgCanvas = document.getElementById('bg-canvas');
    const ctx = bgCanvas.getContext('2d');

    let rotationAngle = 0;
    let audioCtx = null;

    // Create 3D text nodes arranged around the halo
    function createHaloWords() {
      haloRing.innerHTML = '';
      
      WORDS.forEach((word) => {
        const wordEl = document.createElement('div');
        wordEl.className = 'word-item scribble-text absolute font-bold tracking-wider text-3xl sm:text-5xl select-none whitespace-nowrap -translate-x-1/2 -translate-y-1/2 text-center';
        wordEl.innerText = word;

        // Interactive trigger for "riveting"
        if (word === 'riveting') {
          wordEl.classList.add('riveting-word');
          wordEl.setAttribute('title', 'Click to play rivetingv2.mp3');
          wordEl.addEventListener('click', (e) => {
            e.stopPropagation();
            playRivetingAudio();
          });
        }

        haloRing.appendChild(wordEl);
      });

      // Scale ambient light ring to radius
      const diameter = CONFIG.radius * 2;
      haloLight.style.width = `${diameter}px`;
      haloLight.style.height = `${diameter}px`;
    }

    // Main 3D Continuous Spinning Loop
    function animateHalo() {
      rotationAngle += CONFIG.baseSpeed * CONFIG.speedMultiplier;

      // Ensure stage remains exactly centered with CSS transform
      haloStage.style.transform = `translate(-50%, -50%) rotateX(${CONFIG.tilt}deg)`;

      const wordElements = haloRing.querySelectorAll('.word-item');
      const total = wordElements.length;

      wordElements.forEach((el, i) => {
        const baseAngle = (i / total) * Math.PI * 2;
        const currentAngle = baseAngle + rotationAngle;

        // X, Z circle math
        const x = Math.cos(currentAngle) * CONFIG.radius;
        const z = Math.sin(currentAngle) * CONFIG.radius;

        // Counter-rotate text elements to always face camera
        const transform = `translate3d(${x}px, 0px, ${z}px) rotateY(${-currentAngle}rad) rotateX(${-CONFIG.tilt}deg)`;
        el.style.transform = transform;

        // Depth perspective transparency
        const depthNormalized = (z + CONFIG.radius) / (CONFIG.radius * 2);
        el.style.opacity = (0.25 + depthNormalized * 0.75).toFixed(2);
      });

      requestAnimationFrame(animateHalo);
    }

    // Audio Playback Handler with local file + Web Audio fallback
    function playRivetingAudio() {
      // Trigger flash glitch effect
      viewport.classList.add('glitch-active');
      document.body.style.backgroundColor = '#2c2500';
      
      setTimeout(() => {
        viewport.classList.remove('glitch-active');
        document.body.style.backgroundColor = '#000000';
      }, 500);

      // Reset audio position and attempt playing rivetingv2.mp3
      if (rivetingAudio) {
        rivetingAudio.currentTime = 0;
        const playPromise = rivetingAudio.play();

        if (playPromise !== undefined) {
          playPromise.catch((err) => {
            console.warn('Local rivetingv2.mp3 failed to play or was not found. Playing synthesis sound fallback.', err);
            playSynthFallback();
          });
        }
      } else {
        playSynthFallback();
      }
    }

    // Synth Audio Fallback for sandbox environments
    function playSynthFallback() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const now = audioCtx.currentTime;

      // Dark heavy synth bass drop effect
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(32, now + 1.2);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1000, now);
      filter.frequency.exponentialRampToValueAtTime(110, now + 1.2);

      gain.gain.setValueAtTime(0.85, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 1.2);
    }

    // Background floating dust particle system
    let particles = [];
    function initParticles() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
      particles = [];
      const count = Math.floor((bgCanvas.width * bgCanvas.height) / 12000);

      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * bgCanvas.width,
          y: Math.random() * bgCanvas.height,
          radius: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.4 + 0.1,
          speedY: -Math.random() * 0.4 - 0.1
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      ctx.fillStyle = '#ffee00';

      particles.forEach(p => {
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        p.y += p.speedY;
        if (p.y < 0) {
          p.y = bgCanvas.height;
          p.x = Math.random() * bgCanvas.width;
        }
      });

      requestAnimationFrame(animateParticles);
    }

    // Entrance fade out trigger
    function handleIntroAnimation() {
      setTimeout(() => {
        glitchOverlay.style.opacity = '0';
      }, 250);
    }

    window.addEventListener('resize', () => {
      initParticles();
    });

    // Initialize application on window load
    window.onload = () => {
      createHaloWords();
      initParticles();
      animateParticles();
      animateHalo();
      handleIntroAnimation();
    };
  </script>
</body>
</html>
